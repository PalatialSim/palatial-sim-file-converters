[project]
name = "palatial-sim-file-converters"
version = "0.2.1"
description = "Convert simulation scenes between Isaac USD, MuJoCo MJCF, URDF, and glTF."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Palatial" }]
keywords = ["usd", "mjcf", "urdf", "mujoco", "isaac-sim", "gltf"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy",
  "usd-core>=25.5",
]

[project.optional-dependencies]
compile = ["mujoco"]
dev = ["pytest>=8", "mujoco"]

[project.urls]
Homepage = "https://github.com/PalatialSim/palatial-sim-file-converters"
Repository = "https://github.com/PalatialSim/palatial-sim-file-converters"
Issues = "https://github.com/PalatialSim/palatial-sim-file-converters/issues"
Changelog = "https://github.com/PalatialSim/palatial-sim-file-converters/blob/main/CHANGELOG.md"

[project.scripts]
sim-convert = "palatial_sim_file_converters.cli:convert_main"
isaac-usd-to-mjcf = "palatial_sim_file_converters.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
palatial_sim_file_converters = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
